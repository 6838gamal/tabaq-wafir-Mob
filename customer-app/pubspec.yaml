name: restaurant_customer_app
description: Customer ordering and delivery experience for Restaurant Ecosystem Platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3

  # Local Storage
  shared_preferences: ^2.2.3

  # Auth
  google_sign_in: ^6.2.1
  firebase_auth: ^4.19.6
  firebase_core: ^2.30.1
  cloud_firestore: ^4.17.2

  # Location & Maps
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.6.1

  # Notifications
  flutter_local_notifications: ^17.1.2

  # UI & Styling
  google_fonts: ^6.3.2
  responsive_framework: ^1.4.0
  animate_do: ^3.3.4
  cached_network_image: ^3.3.1
  flutter_carousel_widget: ^2.2.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.3.3
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
