name: restaurant_admin_dashboard
description: Platform administration dashboard for Restaurant Ecosystem Platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3+1

  # Local Storage
  shared_preferences: ^2.2.3

  # Auth
  google_sign_in: ^6.2.1
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.3

  # Charts
  fl_chart: ^0.67.0

  # UI & Styling
  google_fonts: ^6.3.2
  responsive_framework: ^1.4.0
  animate_do: ^3.3.4

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
