name: restaurant_driver_app
description: Driver delivery application for Restaurant Ecosystem Platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  dio: ^5.4.3+1
  google_sign_in: ^6.2.1
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.6
  firebase_messaging: ^14.9.4
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  image_picker: ^1.1.1
  fl_chart: ^0.67.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  web_socket_channel: ^2.4.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
