name: tabaq_wafir
description: Restaurant Copilot - Restaurant Operating Intelligence Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # UI & Styling
  google_fonts: ^6.2.1
  responsive_framework: ^1.4.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8
  animate_do: ^3.3.4
  modal_bottom_sheet: ^3.0.0
  percent_indicator: ^4.2.3

  # Auth
  google_sign_in: ^7.2.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  local_auth: ^2.3.0
  uuid: ^4.4.0
  timeago: ^3.7.0
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/animations/
    - assets/icons/

  # Fonts are loaded via google_fonts package at runtime
